name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Windows Build
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install dependencies
        run: |
          npm install -g yarn
          yarn install
      
      - name: Build Windows
        run: |
          yarn package-win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: openmtp-windows
          path: dist/openmtp-*-win-x64.exe
      
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/openmtp-*-win-x64.exe
      
  # macOS Build
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install dependencies
        run: |
          yarn install
      
      - name: Build macOS
        run: |
          yarn package-mac-without-notarize-no-verify
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v3
        with:
          name: openmtp-macos
          path: |
            dist/openmtp-*-mac-x64.dmg
            dist/openmtp-*-mac-arm64.dmg
      
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/openmtp-*-mac-x64.dmg
            dist/openmtp-*-mac-arm64.dmg
      
  # Linux Build
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Install dependencies
        run: |
          yarn install
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg
      
      - name: Build Linux
        run: |
          yarn package-linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v3
        with:
          name: openmtp-linux
          path: |
            dist/openmtp-*-linux-x86_64.AppImage
            dist/openmtp-*-linux-x86_64.deb
            dist/openmtp-*-linux-x86_64.rpm
      
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/openmtp-*-linux-x86_64.AppImage
            dist/openmtp-*-linux-x86_64.deb
            dist/openmtp-*-linux-x86_64.rpm
